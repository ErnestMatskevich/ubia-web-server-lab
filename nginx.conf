worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    server {
        listen 0.0.0.0:8080 default_server;
        server_name _;

        return 200 "Unknown virtual host\n";
    }

    server {
        listen 0.0.0.0:8080;
        server_name aaa.st14.sne22.ru;

        root /usr/local/nginx/html/aaa;
        index index.html;
    }

    server {
        listen 0.0.0.0:8080;
        server_name bbb.st14.sne22.ru;

        root /usr/local/nginx/html/bbb;
        index index.html;
    }
}
